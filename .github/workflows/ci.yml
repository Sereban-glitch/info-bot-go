name: Smart Zapyt v4 isolated browser acceptance
on:
  push:
    branches: ['test/smartzapyt-v4-browser-20261020']
permissions:
  contents: read
concurrency:
  group: smartzapyt-v4-isolated-browser
  cancel-in-progress: false
jobs:
  browser-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af29d13fbf3fffa1a7aebbd825924a7a84e93ca8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply exact supplier patch and tested source manifest
        env:
          V4_DATA_00: ""
          V4_DATA_01: ""
          V4_DATA_02: ""
          V4_DATA_03: ""
          V4_DATA_04: ""
          V4_DATA_05: ""
          V4_DATA_06: ""
          V4_DATA_07: ""
          V4_DATA_08: ""
          V4_DATA_09: ""
          V4_DATA_10: ""
          V4_DATA_11: ""
          V4_DATA_12: ""
        run: |
          python3 - <<'PYCODE'
          import os,json,gzip,base64,hashlib,pathlib,subprocess
          print('Workflow commit:',os.environ['GITHUB_SHA'])
          base=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          assert base=='af29d13fbf3fffa1a7aebbd825924a7a84e93ca8',base
          print('Base:',base)
          data=''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('V4_DATA_'))
          j=json.loads(gzip.decompress(base64.b64decode(data)))
          patch=j['patch'].encode()
          sha=hashlib.sha256(patch).hexdigest()
          assert sha=='98fd822fbc598622bc5b4d4cbe74e893a886095f3cab005fea91b3179a3f9937',sha
          print('Supplier patch SHA256:',sha)
          pathlib.Path('/tmp/v4.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/v4.patch'],check=True)
          subprocess.run(['git','apply','/tmp/v4.patch'],check=True)
          for name,want in j['manifest'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==want,name
          print('Verified exact application files:',len(j['manifest']))
          pathlib.Path('v4-local-only.mjs').write_text(j['adapter'])
          PYCODE
      - name: Install exact test-only dependency without cache or artifacts
        run: |
          npm install --prefix .ci-browser --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.57.0
          .ci-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check assets and seven mocked browser cases
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/v4-local-only.mjs
        run: |
          node mini-app/build-patches.mjs --check
          timeout 300 node --test mini-app/patches/submit-browser.test.mjs
