name: CI

# Проверка на КАЖДЫЙ пуш в любую ветку и на каждый pull request
# (ТЗ №4, D5): раньше сборка проверялась только по тегам v* — сломанный
# код в main мог жить незамеченным до релиза.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify generated MiniApp and regression tests
        run: |
          node mini-app/build-patches.mjs --check
          node --test mini-app/patches/*.test.mjs
          for asset in internal/web/static/assets/index-status-*.js; do node --check "$asset"; done

      - uses: actions/setup-go@v5
        with:
          # 1.24 — минимальная версия go.mod (зависимость ledongthuc/pdf
          # для извлечения текста из PDF-вложений требует go >= 1.24.1)
          go-version: '1.24'

      - name: Vet (статический анализ)
        run: go vet ./...

      - name: Test (юнит-тесты)
        run: go test ./... -count=1

      - name: Build (сборка боевого бинарника)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o info-bot-linux-amd64 .
          chmod +x info-bot-linux-amd64
          ls -la info-bot-linux-amd64

  miniapp-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test compiled MiniApp on mobile and desktop
        run: python mini-app/qa/ui_test.py --browser-path "$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miniapp-ui-results
          path: mini-app/qa/results/
          if-no-files-found: warn
