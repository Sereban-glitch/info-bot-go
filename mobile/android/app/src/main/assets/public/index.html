<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BERTHOUD — База відгуків</title>
  <link rel="stylesheet" href="style.css">
  <script src="cap-filesystem.js"></script>
  <script src="cap-share.js"></script>
  <script src="xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div>
        <div class="header-logo">BERTHOUD</div>
        <div class="header-sub">База відгуків · офлайн</div>
      </div>
      <div class="header-sub" id="dbdate"></div>
    </header>

    <!-- Screen 1: Home Dashboard -->
    <main class="screen active" id="screen-home">
      <section class="hero">
        <div class="hero-title">Відгуків у базі</div>
        <div class="hero-num" id="hTotal">…</div>
        <div class="hero-sub" id="hSub"></div>
      </section>

      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-num red" id="sCrit">…</div>
          <div class="stat-label">Критичні</div>
        </div>
        <div class="stat-card">
          <div class="stat-num gold" id="sBattle">…</div>
          <div class="stat-label">Бойові</div>
        </div>
        <div class="stat-card">
          <div class="stat-num green" id="sBrands">…</div>
          <div class="stat-label">Бренди</div>
        </div>
        <div class="stat-card">
          <div class="stat-num gold" id="sSrc">…</div>
          <div class="stat-label">Джерела</div>
        </div>
      </section>

      <div class="section-title">Топ бренди <span class="count" id="bCount"></span></div>
      <div class="brand-grid" id="brandTiles"></div>

      <div class="section-title">Топ проблеми <span class="count" id="pCount"></span></div>
      <div id="probList"></div>
    </main>

    <!-- Screen 2: Reviews Database -->
    <main class="screen" id="screen-reviews">
      <div class="search-bar">
        <span>🔍</span>
        <input class="search-input" id="q" type="search" placeholder="Пошук по тексту відгуку…">
      </div>

      <div class="filter-label">Бренд</div>
      <div class="filter-row" id="fBrands"></div>

      <div class="filter-label">Проблема</div>
      <div class="filter-row" id="fProbs"></div>

      <div class="filter-label">Джерело</div>
      <div class="filter-row" id="fSrcs"></div>

      <div class="sort-row">
        <div class="sort-count" id="cnt"></div>
        <select class="sort-select" id="sort">
          <option value="relevance">⭐ Релевантність</option>
          <option value="critical">⚠ Критичні спочатку</option>
          <option value="date">📅 Новіші спочатку</option>
          <option value="params">🔧 З параметрами</option>
          <option value="all">🧾 Усі, включно зі слабкими</option>
        </select>
      </div>

      <div class="export-group">
        <button class="btn-export-main" id="expXlsx">⬇ Excel (.xlsx)</button>
        <button class="btn-export-sub" id="expCsv">CSV</button>
        <button class="btn-export-sub" id="expJson">JSON</button>
      </div>

      <a class="btn-engineer" href="https://t.me/AgroLogic24Bot" target="_blank" rel="noopener">🧑‍🔧 Спитати інженера в Telegram</a>

      <div id="list"></div>
      <button id="more">Показати ще</button>
    </main>

    <!-- Screen 3: Battle & Talk Tracks -->
    <main class="screen" id="screen-battle">
      <div class="section-title">⚔️ Бойові аргументи <span class="count" id="bCnt"></span></div>
      <div class="filter-row" id="fBB"></div>

      <div class="section-title">🗣 Треки розмови <span class="count" id="ttCnt"></span></div>
      <div id="tlist"></div>

      <div class="section-title">🤖 ИИ-картка <span class="count" id="aiCnt"></span></div>
      <div id="alist"></div>

      <div class="section-title">📋 Усі бойові відгуки</div>
      <div id="blist"></div>
    </main>

    <!-- Screen 4: Bookmarks / Favorites -->
    <main class="screen" id="screen-fav">
      <div class="section-title">⭐ Збережені відгуки <span class="count" id="fCnt"></span></div>
      <div id="flist"></div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottomnav">
      <button class="nav-item active" data-s="home">
        <span class="nav-icon">🏠</span>
        <span>Головна</span>
      </button>
      <button class="nav-item" data-s="reviews">
        <span class="nav-icon">🔍</span>
        <span>База</span>
      </button>
      <button class="nav-item" data-s="battle">
        <span class="nav-icon">⚔️</span>
        <span>Зустріч</span>
      </button>
      <button class="nav-item" data-s="fav">
        <span class="nav-icon">⭐</span>
        <span>Збережені</span>
      </button>
    </nav>
  </div>

  <script src="export.js"></script>
  <script src="app.js"></script>
</body>
</html>
